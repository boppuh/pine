[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "decision-edge-ledger"
version = "0.1.0"
description = "Local-first integrity substrate for the Decision Edge Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.139,<1",
  "filelock>=3.15,<4",
  "jsonschema[format]>=4.22,<5",
  "openai>=2.46,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.51,<1",
  "watchdog>=6.0,<7",
]

[project.scripts]
msm-ledger = "ledger.cli:main"
pine-ledger-backend = "ledger.backend_cli:main"
pine-ledger-backup = "ledger.backup_cli:main"
pine-obsidian-bridge = "ledger.bridge_cli:main"

[project.optional-dependencies]
dev = [
  "httpx2>=2.7,<3",
  "pyright>=1.1.411,<2",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.15.22,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["ledger"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "live_openai: opt-in smoke test that calls the real OpenAI API",
]

[tool.coverage.run]
branch = true
source = ["ledger"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
